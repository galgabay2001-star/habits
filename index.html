<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habitly">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f8">
<style>
.intro, .home { display: none !important; }
.stage { display: flex !important; justify-content: center; }
@media (max-width: 480px) {
  body { padding: 0 !important; }
  .screen { padding-top: max(8px, env(safe-area-inset-top)) !important; padding-inline: 14px !important; }
  .tabbar { padding-bottom: max(16px, env(safe-area-inset-bottom)) !important; }
}
</style>
</head>
<body>
<title>Habitly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Secular+One&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an iPhone-sized working app beside a home-screen panel with the three widgets; stacks on phones. */
:root {
  --bg: #eef1f8; --surface: #ffffff; --surface-2: #f4f6fb; --line: #dfe4ef;
  --fg: #141a2b; --muted: #5d6680; --faint: #8b93aa;
  --accent: #4f7cff; --accent-soft: rgba(79,124,255,.12); --on-accent: #ffffff;
  --done: #23a26d; --partial: #e59a1e; --missed: #e5575a; --rest: #3b8fe0; --nodata: #a3a9ba;
  --wall-1: #4064e8; --wall-2: #7a5be0;
  --font-display: "Secular One", "Assistant", system-ui, sans-serif;
  --font-body: "Assistant", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r-lg: 22px; --r-md: 16px; --r-sm: 11px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0e17; --surface: #151a28; --surface-2: #1c2233; --line: #283049;
  --fg: #eef1fa; --muted: #a2aac2; --faint: #6f7893;
  --accent: #7096ff; --accent-soft: rgba(112,150,255,.16); --on-accent: #0b0e17;
  --done: #3cc68a; --partial: #f0b142; --missed: #f0787a; --rest: #5aa7f0; --nodata: #5c647b;
  --wall-1: #1d2b6b; --wall-2: #3b2a77; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b0e17; --surface: #151a28; --surface-2: #1c2233; --line: #283049;
  --fg: #eef1fa; --muted: #a2aac2; --faint: #6f7893;
  --accent: #7096ff; --accent-soft: rgba(112,150,255,.16); --on-accent: #0b0e17;
  --done: #3cc68a; --partial: #f0b142; --missed: #f0787a; --rest: #5aa7f0; --nodata: #5c647b;
  --wall-1: #1d2b6b; --wall-2: #3b2a77; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 40px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.data { font-family: var(--font-data); font-size: 11px; color: var(--faint); letter-spacing: .01em; }

.stage { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 420px); gap: 36px; justify-content: center; align-items: start; max-width: 900px; margin: 0 auto; }
.intro { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between; }
.intro h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); max-width: 62ch; }
.intro-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }

/* Phone */
.phone { position: relative; width: 100%; max-width: 400px; height: 820px; max-height: calc(100vh - 40px); min-height: 640px; margin: 0 auto; background: var(--bg); border: 10px solid #10131c; border-radius: 52px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 60px -30px rgba(20,30,70,.45); }
@media (max-width: 480px) { .phone { border-width: 0; border-radius: 0; height: auto; max-height: none; min-height: 0; box-shadow: none; overflow: visible; } }
.statusbar { height: 34px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 26px; font-weight: 700; font-size: 13px; }
@media (max-width: 480px) { .statusbar { display: none; } }
.screen { flex: 1; overflow-y: auto; padding: 4px 16px 96px; scrollbar-width: thin; }
@media (max-width: 480px) { .screen { overflow: visible; padding: 4px 0 90px; } }
.navbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0 10px; }
.navbar h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--surface); display: grid; place-items: center; color: var(--accent); }
.iconbtn svg { width: 20px; height: 20px; }
.backbtn { border: none; background: none; color: var(--accent); font-weight: 600; padding: 6px 0; display: inline-flex; gap: 4px; align-items: center; }

.tabbar { position: absolute; inset-inline: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 6px calc(16px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(16px); border-top: 1px solid var(--line); z-index: 5; }
@media (max-width: 480px) { .tabbar { position: fixed; } }
.tab { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--faint); padding: 2px 0; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }

/* Generic blocks */
.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { margin: 0; font-size: 16px; font-weight: 700; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 13px; } .tiny { font-size: 11.5px; }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: none; background: none; border-radius: 8px; padding: 6px 4px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); white-space: nowrap; }
.pill-btn { border: none; background: var(--accent); color: var(--on-accent); border-radius: 12px; padding: 11px 16px; font-weight: 700; }
.pill-btn.secondary { background: var(--accent-soft); color: var(--accent); }
.pill-btn.danger { background: color-mix(in srgb, var(--missed) 14%, transparent); color: var(--missed); }
.link { border: none; background: none; color: var(--accent); font-weight: 600; padding: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface-2); border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .t { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .v.nd { font-size: 14px; font-weight: 600; color: var(--muted); }
.tile .b { font-family: var(--font-data); font-size: 10.5px; color: var(--faint); line-height: 1.35; }
.empty { text-align: center; padding: 24px 12px; color: var(--muted); }

/* Today */
.hero { display: flex; gap: 18px; align-items: center; }
.ring { position: relative; width: 104px; height: 104px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .lbl b { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1; }
.ring circle { transition: stroke-dashoffset .5s cubic-bezier(.3,.9,.3,1); }
.greet { font-family: var(--font-display); font-size: 21px; line-height: 1.1; }
/* Live hero header on the home screen: time-of-day gradient, greeting, daily line, today's progress ring. */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 18px 18px 16px; color: #fff; background: linear-gradient(135deg, var(--h1), var(--h2)); box-shadow: 0 18px 36px -20px var(--h2); cursor: pointer; isolation: isolate; text-align: right; direction: rtl; border: 0; font: inherit; width: 100%; display: block; }
.hero.h-intro { animation: heroIn .5s cubic-bezier(.2,.8,.2,1); }
.hero.h-intro circle.fg { animation: ringIn 1s cubic-bezier(.2,.8,.2,1); }
@keyframes ringIn { from { stroke-dashoffset: 169.6; } }
.hero.morning { --h1: #ffa24c; --h2: #ff4f8b; }
.hero.noon { --h1: #2f7bff; --h2: #14c2d4; }
.hero.evening { --h1: #8b5cff; --h2: #ff679f; }
.hero.night { --h1: #24307f; --h2: #7a45e0; }
.hero .blob { position: absolute; border-radius: 50%; background: rgba(255,255,255,.18); z-index: -1; filter: blur(2px); animation: floaty 9s ease-in-out infinite; }
.hero .b1 { width: 160px; height: 160px; top: -60px; left: -40px; }
.hero .b2 { width: 90px; height: 90px; bottom: -30px; left: 110px; animation-delay: -3s; background: rgba(255,255,255,.12); }
.hero .b3 { width: 46px; height: 46px; top: 14px; left: 46%; animation-delay: -6s; background: rgba(255,255,255,.1); }
.hero-top { display: flex; align-items: center; gap: 14px; }
.hero-hi { flex: 1; min-width: 0; }
.hero-hi .hh { font-family: var(--font-display); font-size: 27px; line-height: 1.1; display: flex; align-items: center; gap: 8px; }
.hero-hi .hh .em { font-size: 26px; animation: bob 3s ease-in-out infinite; display: inline-block; }
.hero-hi .hd { font-size: 13px; opacity: .85; margin-top: 3px; }
.hero-ring { position: relative; width: 66px; height: 66px; flex: none; }
.hero-ring svg { transform: rotate(-90deg); }
.hero-ring .rv { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 16px; line-height: 1; }
.hero-ring .rv small { display: block; font-size: 10px; font-weight: 600; opacity: .85; margin-top: 2px; }
.hero-ring circle.fg { transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); }
.hero-quote { margin: 14px 0 12px; font-size: 17px; font-weight: 700; line-height: 1.35; text-wrap: balance; }
.hero-quote.swap { animation: fadeUp .45s ease; }
.hero-status { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.hero-tip { position: absolute; bottom: 12px; left: 16px; font-size: 11px; opacity: .7; }
.hero.alldone .hero-status { background: rgba(255,255,255,.32); }
@keyframes floaty { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(14px,10px) scale(1.08); } }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(-8deg); } }
@keyframes heroIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.grip { flex: none; display: grid; place-items: center; width: 22px; height: 40px; margin-inline-end: -6px; color: var(--faint); cursor: grab; touch-action: none; border-radius: 8px; }
.grip:active { cursor: grabbing; color: var(--fg); }
.habit.dragging { position: relative; z-index: 5; box-shadow: 0 12px 30px rgba(0,0,0,.25); transform-origin: center; transition: none; opacity: .97; }
.habit.dragging .grip { color: var(--hc); }
.hlist.sorting .habit:not(.dragging) { transition: transform .15s; }
.habit { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 18px; padding: 10px 12px; min-width: 0; transition: opacity .25s; }
.habit.is-done { opacity: 1; }
/* Colorful cards: habit-color stripe on the start edge + soft tint; done fills the card with its color */
.habit { position: relative; overflow: hidden; background: linear-gradient(to left, color-mix(in srgb, var(--hc) 10%, var(--surface)), var(--surface) 65%); box-shadow: 0 6px 16px -14px color-mix(in srgb, var(--hc) 80%, transparent); }
.habit::before { content: ""; position: absolute; inset-block: 12px; inset-inline-start: 0; width: 4px; border-radius: 4px 0 0 4px; background: var(--hc); }
.habit.is-done { background: color-mix(in srgb, var(--hc) 17%, var(--surface)); }
.habit.is-done .hicon { background: color-mix(in srgb, var(--hc) 30%, transparent); }
.habit.delrow::before { display: none; }
.sbadge { display: inline-flex; align-items: center; gap: 2px; margin-inline-start: 6px; padding: 1px 7px; border-radius: 99px; font-size: 11.5px; font-weight: 800; vertical-align: 1px; background: color-mix(in srgb, var(--hc) 18%, transparent); color: var(--fg); text-decoration: none; display: inline-flex; }
.habit.is-done .sbadge { text-decoration: none; }
/* Streak milestones: celebration card + badges on the habit page */
.mile-scrim { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(8,10,20,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: mFade .25s ease; overflow: hidden; }
.mile-card { position: relative; width: min(290px, 84%); text-align: center; padding: 26px 20px 20px; border-radius: 28px; color: #fff; background: linear-gradient(150deg, var(--m1), var(--m2)); box-shadow: 0 24px 60px -20px var(--m2); animation: mPop .55s cubic-bezier(.2,1.5,.4,1); direction: rtl; }
.mile-card .m-em { font-size: 64px; line-height: 1; display: inline-block; animation: mBounce 1.2s ease-in-out .4s infinite; filter: drop-shadow(0 6px 10px rgba(0,0,0,.25)); }
.mile-card .m-title { font-family: var(--font-display); font-size: 28px; margin: 12px 0 4px; }
.mile-card .m-sub { font-size: 14px; opacity: .92; }
.mile-card .m-line { font-size: 15px; font-weight: 700; margin: 12px 0 18px; }
.mile-card button { border: 0; border-radius: 99px; padding: 11px 30px; font: inherit; font-weight: 800; font-size: 15px; background: #fff; color: var(--m2); cursor: pointer; }
.mile-card .m-ray { position: absolute; inset: -40px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.35), transparent 60%); z-index: -1; animation: mGlow 2s ease-in-out infinite; }
.confetti { position: absolute; top: -12px; width: 8px; height: 13px; border-radius: 2px; animation: cFall linear forwards; }
@keyframes mFade { from { opacity: 0; } }
@keyframes mPop { from { transform: scale(.4) rotate(-6deg); opacity: 0; } }
@keyframes mBounce { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.08); } }
@keyframes mGlow { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
@keyframes cFall { to { transform: translate(var(--dx), 760px) rotate(var(--rot)); opacity: .9; } }
.miles { padding: 14px; direction: rtl; text-align: right; }
.miles-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.mb { flex: none; width: 62px; text-align: center; padding: 8px 4px; border-radius: 16px; background: var(--surface-2); }
.mb .e { font-size: 24px; display: block; filter: grayscale(1); opacity: .35; }
.mb small { display: block; font-size: 10.5px; font-weight: 700; color: var(--faint); margin-top: 3px; }
.mb.got { background: color-mix(in srgb, var(--hc) 16%, var(--surface)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--hc) 50%, transparent); }
.mb.got .e { filter: none; opacity: 1; }
.mb.got small { color: var(--fg); }
.miles-next { font-size: 13px; font-weight: 700; margin-top: 10px; }
.miles-bar { height: 7px; border-radius: 99px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.miles-bar i { display: block; height: 100%; border-radius: inherit; background: var(--hc); }
/* "you're on this habit — tap to open": hover / keyboard focus lights the row in its color, press shrinks it */
.habit { transition: opacity .25s, transform .16s ease, box-shadow .2s ease, background-color .2s ease; }
.habit:has(.hlink:hover), .habit:has(.hlink:focus-visible) {
  background: color-mix(in srgb, var(--hc) 9%, var(--surface));
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--hc) 55%, transparent), 0 8px 20px -10px color-mix(in srgb, var(--hc) 60%, transparent);
  transform: translateY(-1px); opacity: 1; }
.habit:has(.hlink:active) { transform: scale(.975); background: color-mix(in srgb, var(--hc) 14%, var(--surface)); }
.hgo { display: inline-flex; vertical-align: -1px; margin-inline-start: 6px; color: var(--hc); font-weight: 800; opacity: 0; transform: translateX(4px); transition: opacity .18s, transform .18s; }
.hlink:hover .hgo, .hlink:focus-visible .hgo, .hlink:active .hgo { opacity: 1; transform: translateX(0); }
.habit.is-done .hname { text-decoration: line-through; text-decoration-color: var(--faint); }
.hicon { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 21px; flex: none; background: color-mix(in srgb, var(--hc) 16%, transparent); }
.hmain { flex: 1; min-width: 0; border: none; background: none; text-align: start; padding: 0; display: flex; flex-direction: column; }
div.hmain .hsub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hname { font-weight: 700; font-size: 15.5px; direction: rtl; }
.hsub { direction: rtl; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.listbar { display: flex; justify-content: space-between; align-items: center; margin: -4px 0 -6px; direction: rtl; }
.add-enter { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid color-mix(in srgb, var(--accent) 30%, transparent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); color: var(--accent); border-radius: 999px; padding: 7px 16px; font-weight: 800; font-size: 13.5px; font-family: inherit; cursor: pointer; box-shadow: 0 6px 14px -10px var(--accent); transition: transform .18s cubic-bezier(.2,1.5,.4,1), box-shadow .18s, background-color .18s; }
.add-enter:hover { transform: scale(1.05); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); box-shadow: 0 10px 20px -10px var(--accent); }
.add-enter:active { transform: scale(1.1); }
.listbar .del-enter { padding: 3px 8px; font-size: 10.5px; font-weight: 700; gap: 3px; border-width: 1px; opacity: .75; }
.listbar .del-enter svg { width: 11px; height: 11px; }
.listbar .link.on { color: var(--done); font-weight: 800; }
.del-enter { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid color-mix(in srgb, #e5484d 45%, transparent); background: color-mix(in srgb, #e5484d 8%, transparent); color: #e5484d; border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 13.5px; }
.delbanner { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: color-mix(in srgb, #e5484d 12%, var(--surface)); border: 1.5px solid #e5484d; direction: rtl; }
.delbanner .grow { display: flex; flex-direction: column; gap: 2px; }
.delbanner b { color: #e5484d; font-size: 15px; }
.del-done { border: none; background: #e5484d; color: #fff; border-radius: 12px; padding: 10px 18px; font-weight: 800; font-size: 15px; }
.habit.delrow { border: 1.5px dashed color-mix(in srgb, #e5484d 40%, transparent); transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .2s, background-color .2s, border-color .2s; }
.habit.delrow:not(.asking):hover { transform: translateY(-3px) scale(1.015); border-style: solid; border-color: #e5484d; background: color-mix(in srgb, #e5484d 8%, var(--surface)); box-shadow: 0 12px 26px -12px rgba(229,72,77,.65); }
.habit.delrow .del-ask { transition: transform .18s, background-color .18s, color .18s; }
.habit.delrow:not(.asking):hover .del-ask { transform: scale(1.12); background: #e5484d; color: #fff; }
.rbar.rb-empty { padding: 0; }
.nstep { display: inline-flex; align-items: center; gap: 4px; padding: 3px; border-radius: 999px; background: var(--surface-2); max-width: 60%; }
.field .nstep input[type=number] { width: 64px; max-width: none; text-align: center; background: transparent; font-weight: 800; font-size: 16px; padding: 4px 2px; -moz-appearance: textfield; appearance: textfield; }
.nstep input::-webkit-outer-spin-button, .nstep input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.ns-b { width: 34px; height: 34px; flex: none; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--accent); background: var(--surface); box-shadow: 0 2px 6px -2px rgba(0,0,0,.18); transition: transform .12s, background-color .15s; }

.habit.delrow .hmain { display: flex; flex-direction: column; gap: 2px; }

.toast { display: flex; align-items: center; gap: 10px; direction: rtl; }

.more { width: 30px; height: 30px; border: none; border-radius: 50%; background: none; color: var(--faint); font-size: 18px; line-height: 1; }
.check { width: 48px; height: 48px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--hc) 45%, transparent); flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--hc) 13%, transparent); position: relative; }
.check svg.p { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); transform: rotate(-90deg); }
.check .tick { width: 22px; height: 22px; color: #fff; opacity: 0; transform: scale(.4); transition: transform .3s cubic-bezier(.3,1.6,.5,1), opacity .2s; }
.check.on { background: var(--hc); border-color: var(--hc); }

@keyframes pop { 40% { transform: scale(1.14); } }
details.others summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 2px; }

/* Sheet */
.scrim { position: absolute; inset: 0; background: rgba(8,10,20,.38); z-index: 20; display: flex; align-items: flex-end; animation: fade .2s; }
@media (max-width: 480px) { .scrim { position: fixed; } }
.sheet { background: var(--bg); width: 100%; max-height: 92%; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 10px 16px 28px; animation: up .28s cubic-bezier(.2,.9,.3,1); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 8px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 8px; }
.sheet-head h3 { margin: 0; font-size: 18px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.form { display: flex; flex-direction: column; gap: 2px; background: var(--surface); border-radius: var(--r-md); overflow: hidden; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.field:last-child { border-bottom: none; }
.field label { flex: none; }
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time], .field select, .field textarea { border: none; background: var(--surface-2); border-radius: 8px; padding: 6px 10px; min-width: 0; max-width: 60%; }
.field input[type=text].wide { max-width: none; flex: 1; font-size: 17px; font-weight: 600; background: none; padding: 4px 0; }
/* Daily reminder — modern picker */
.rem-card { padding: 4px 0 12px; gap: 0; direction: rtl; }
.rp-head .grow { flex: 1; min-width: 0; }
.rp-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
.rp-ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, transparent); font-size: 18px; }
.rp-head b { display: block; font-size: 15px; } .rp-head small { display: block; font-size: 12px; color: var(--muted); }
.sw { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); position: relative; transition: background .2s; flex: none; cursor: pointer; margin: 0; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 25px; height: 25px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.25); transition: transform .2s; }
.sw:checked { background: #34c759; border-color: #34c759; } .sw:checked::after { transform: translateX(20px); }
.rp-body { display: flex; flex-direction: column; gap: 12px; padding: 0 14px; transition: opacity .2s; }
.rem-card:has(#e-rem:not(:checked)) .rp-body { opacity: .35; pointer-events: none; }
.rp-time { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface-2); border-radius: 18px; padding: 6px 0; }
.rp-col { display: flex; flex-direction: column; align-items: center; }
.rp-col b { font-family: var(--font-display); font-size: 46px; font-weight: 600; line-height: 1.05; letter-spacing: -1px; min-width: 72px; text-align: center; }
.rp-colon { font-size: 40px; font-weight: 600; color: var(--muted); padding-bottom: 6px; }
.rp-ar { border: none; background: none; color: var(--accent); width: 44px; height: 28px; display: grid; place-items: center; border-radius: 10px; }
.rp-ar:active { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.rp-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rp-presets button { border: none; background: var(--surface-2); border-radius: 14px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--fg); }
.rp-presets button span { font-size: 17px; } .rp-presets button b { font-size: 12px; } .rp-presets button small { font-size: 11px; color: var(--muted); }
.rp-presets button[aria-pressed="true"] { background: var(--accent); color: #fff; } .rp-presets button[aria-pressed="true"] small { color: rgba(255,255,255,.85); }
.form-title { font-size: 12.5px; color: var(--muted); padding: 14px 6px 6px; letter-spacing: .02em; }
.wd { display: flex; gap: 5px; padding: 10px 14px; direction: ltr; }
.wd button { flex: 1; aspect-ratio: 1; max-width: 42px; border-radius: 50%; border: none; background: var(--surface-2); font-weight: 700; font-size: 13px; }
.wd button { position: relative; transition: background .15s, transform .15s; }

.swatches, .icons { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px; }

.swatches button[aria-pressed="true"] { outline-color: var(--fg); }

.more-icons { margin: -2px auto 8px; display: flex; align-items: center; justify-content: center; border: none; background: var(--surface-2); color: var(--accent); border-radius: 999px; width: 48px; height: 30px; padding: 0; }
.icons button { width: 38px; height: 38px; border-radius: 11px; border: none; background: var(--surface-2); font-size: 19px; }

/* Lists */

.li-actions { display: flex; gap: 2px; }

.search { width: 100%; border: none; background: var(--surface); border-radius: 12px; padding: 9px 12px; }
.cat-title { font-size: 12.5px; color: var(--muted); padding: 10px 4px 6px; font-weight: 600; letter-spacing: .02em; }

/* Calendar */
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }

/* Lively calendar: month banner, colorful tiles, heat-tinted days with habit dots */
.mbanner { position: relative; overflow: hidden; isolation: isolate; border-radius: 22px; padding: 12px 10px; color: #fff; background: linear-gradient(135deg, var(--g1), var(--g2)); box-shadow: 0 14px 30px -18px var(--g2); direction: rtl; }

.mbanner .b1 { width: 140px; height: 140px; top: -60px; right: -30px; }
.mbanner .b2 { width: 70px; height: 70px; bottom: -25px; left: 30%; animation-delay: -4s; background: rgba(255,255,255,.1); }
.mb-mid { text-align: center; display: flex; flex-direction: column; align-items: center; }

.mb-chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.mb-chips span { background: rgba(255,255,255,.22); border-radius: 99px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
.ctile { position: relative; overflow: hidden; background: linear-gradient(135deg, color-mix(in srgb, var(--tc) 16%, var(--surface)), color-mix(in srgb, var(--tc) 5%, var(--surface-2))) !important; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 22%, transparent); }
.ctile b { color: var(--tc) !important; }
.ct-ic { position: absolute; top: 9px; right: 10px; font-size: 17px; }
.month .day { animation: dayIn .35s cubic-bezier(.2,.8,.2,1) both; transition: transform .15s; }
.month .day:not(:disabled):active { transform: scale(.92); }
@keyframes dayIn { from { opacity: 0; transform: translateY(6px) scale(.9); } }
.cday { background: color-mix(in srgb, #22c55e var(--heat, 0%), var(--surface-2)); }
.cday .cd-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 90%; min-height: 5px; }
.cday .cd-dots i { width: 5px; height: 5px; border-radius: 50%; }
.cday.cal-perfect { background: linear-gradient(140deg, #ffe08a, #ffb347) !important; box-shadow: 0 6px 14px -8px #f59e0b !important; color: #5a3800; }
.cday.cal-perfect .cd-f { color: #5a3800; }

@keyframes twinkle { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .6; transform: scale(1.3); } }
.month .day.today { outline: none; box-shadow: 0 0 0 2px var(--accent); animation: dayIn .35s both, todayPulse 2.4s ease-in-out .5s infinite; }
@keyframes todayPulse { 0%,100% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); } 50% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 6px color-mix(in srgb, var(--accent) 10%, transparent); } }
.month .cal-done { background: linear-gradient(140deg, var(--hc), color-mix(in srgb, var(--hc) 70%, #fff)); box-shadow: 0 4px 10px -6px var(--hc); }
.lg-dots { display: inline-flex; gap: 2px; vertical-align: middle; margin-inline-end: 4px; }
.lg-dots i { width: 6px; height: 6px; border-radius: 50%; background: #4f7cff; }
.lg-dots i:nth-child(2) { background: #f5a623; }
.lg-dots i:nth-child(3) { background: #22c55e; }
.st-full { background: var(--done); color: #fff; }
.st-partial { background: color-mix(in srgb, var(--done) var(--p, 45%), var(--surface-2)); }
.st-missed { background: color-mix(in srgb, var(--missed) 32%, var(--surface-2)); }
.st-nodata { background: color-mix(in srgb, var(--nodata) 45%, var(--surface-2)); }
.st-noplan, .st-bonus { background: var(--surface-2); color: var(--faint); }
.st-future { background: transparent; color: var(--faint); }
.year-wrap { overflow-x: auto; direction: ltr; padding-bottom: 4px; }
.year { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; width: max-content; }
.year span { width: 12px; height: 12px; border-radius: 3px; display: block; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-inline-end: 4px; }

/* Charts */
.chart { width: 100%; height: auto; display: block; direction: ltr; }
.chart text { fill: var(--faint); font-family: var(--font-data); font-size: 9px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.bars-h { display: flex; flex-direction: column; gap: 7px; }

.bar-h .fill { height: 100%; background: var(--accent); border-radius: 5px; }
.progress { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }
.badge-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.badge { background: var(--surface); border-radius: var(--r-md); padding: 12px; text-align: center; display: flex; flex-direction: column; gap: 3px; align-items: center; }
.badge .ic { font-size: 26px; filter: grayscale(1); opacity: .45; }
.badge.on .ic { filter: none; opacity: 1; }
.insight { border-inline-start: 3px solid var(--c); padding: 2px 10px; display: flex; flex-direction: column; gap: 2px; }

/* Home screen + widgets */
.home { border-radius: 40px; padding: 26px 22px 30px; background: linear-gradient(160deg, var(--wall-1), var(--wall-2)); display: flex; flex-direction: column; gap: 18px; color: #fff; }
.home h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.home p { margin: 0; font-size: 13px; opacity: .85; }
.wrow { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.widget { background: var(--surface); color: var(--fg); border-radius: 24px; padding: 14px; box-shadow: 0 10px 30px -14px rgba(0,0,0,.45); min-width: 0; }
.w-small { width: 158px; height: 158px; display: flex; flex-direction: column; padding: 10px; }
.w-medium { width: 100%; max-width: 338px; height: 158px; display: flex; flex-direction: column; gap: 8px; }
.w-large { width: 100%; max-width: 338px; min-height: 354px; display: flex; flex-direction: column; gap: 6px; }
.w-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 800; }
.w-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.w-item { display: flex; align-items: center; gap: 8px; border: none; background: none; text-align: start; padding: 2px 0; min-width: 0; }
.w-dot { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 14px; background: color-mix(in srgb, var(--hc) 16%, transparent); position: relative; }
.w-item.on .w-dot { background: var(--hc); color: #fff; font-weight: 800; }
.w-item .nm { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-item.on .nm { text-decoration: line-through; color: var(--muted); }
.w-item .dt { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-label { font-size: 12px; text-align: center; opacity: .9; margin-top: 6px; }
.note { background: rgba(255,255,255,.14); border-radius: 14px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45; }
.toast { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); min-width: 200px;
  background: rgba(22, 24, 30, .86); color: #fff; backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6);
  border: 1px solid rgba(255,255,255,.08); border-radius: 22px; padding: 8px 10px 8px 18px; font-size: 13.5px; z-index: 30;
  box-shadow: 0 12px 32px -8px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.18); }
.toast.in { animation: toastIn .42s cubic-bezier(.2, 1.4, .4, 1) both; }
.toast.out { animation: toastOut .26s ease-in both; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -24px) scale(.88); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, -16px) scale(.94); } }
.name-field .name-ic { width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center; background: #34c759; color: #fff; transform: scale(0); opacity: 0; transition: transform .25s cubic-bezier(.2,1.5,.4,1), opacity .2s; }
.name-field.name-ok .name-ic { transform: scale(1); opacity: 1; }
.name-field.name-err { box-shadow: inset 0 0 0 2px #ff3b30; border-radius: 12px; animation: nameShake .4s; }
@keyframes nameShake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
.t-ic { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--tc); color: #fff; box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 30%, transparent); }
.t-ic.emoji { background: color-mix(in srgb, var(--tc) 30%, rgba(255,255,255,.08)); font-size: 16px; }
.t-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.t-txt b { font-size: 14px; font-weight: 700; } .t-txt small { font-size: 12px; color: rgba(255,255,255,.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 480px) { .toast { position: fixed; top: max(14px, env(safe-area-inset-top)); } }
textarea.export { width: 100%; height: 160px; font-family: var(--font-data); font-size: 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 8px; direction: ltr; }
/* Per-habit day marks */
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot-done { background: var(--hc, var(--accent)); }
.dot-open { box-shadow: inset 0 0 0 1.5px var(--faint); }
.dot-today { box-shadow: inset 0 0 0 1.5px var(--hc, var(--accent)); }
.dot-rest { background: color-mix(in srgb, var(--rest) 35%, transparent); }
.dot-off { background: color-mix(in srgb, var(--rest) 35%, transparent); transform: scale(.6); }   /* rest day = a day not chosen for the habit (automatic) */
.dot-future, .dot-pad { background: transparent; }
.legend i.dot { border-radius: 50%; }
.legend .dot { width: 10px; height: 10px; margin-inline-end: 4px; vertical-align: -1px; }
.strip { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
.strip-md { gap: 4px; }
.strip-md .dot { width: 8px; height: 8px; }
.daygrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; justify-items: center; }
.daygrid .h { font-size: 11px; color: var(--faint); }

<script>
/*
 * HabitCore engine — JavaScript reference implementation.
 * Mirrors Core/Sources/HabitCore (Swift). Both are verified against
 * Core/Tests/Fixtures/engine_cases.json so the app, the widget and the
 * prototype always compute identical numbers.
 *
 * Pure functions only: no I/O, no clock. "today" is always passed in.
 */
(function (root) {
  'use strict';

  // ───────────────────────── Days ─────────────────────────
  // A day is an integer: days since 1970-01-01 (local calendar, no TZ math).
  function dayFromString(s) {
    const [y, m, d] = s.split('-').map(Number);
    return daysFromCivil(y, m, d);
  }
  function dayToString(n) {
    const { y, m, d } = civilFromDays(n);
    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  // Howard Hinnant's algorithms (proleptic Gregorian).
  function daysFromCivil(y, m, d) {
    y -= m <= 2 ? 1 : 0;
    const era = Math.floor(y / 400);
    const yoe = y - era * 400;
    const doy = Math.floor((153 * (m + (m > 2 ? -3 : 9)) + 2) / 5) + d - 1;
    const doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy;
    return era * 146097 + doe - 719468;
  }
  function civilFromDays(z) {
    z += 719468;
    const era = Math.floor(z / 146097);
    const doe = z - era * 146097;
    const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365);
    const y = yoe + era * 400;
    const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100));
    const mp = Math.floor((5 * doy + 2) / 153);
    const d = doy - Math.floor((153 * mp + 2) / 5) + 1;
    const m = mp + (mp < 10 ? 3 : -9);
    return { y: y + (m <= 2 ? 1 : 0), m, d };
  }
  /** 0 = Sunday … 6 = Saturday */
  function weekday(n) { return ((n % 7) + 7 + 4) % 7; }
  /** First day of the week containing n. weekStart: 0=Sunday (Israel default). */
  function weekStartOf(n, weekStart) { return n - ((weekday(n) - weekStart + 7) % 7); }
  function monthStartOf(n) { const c = civilFromDays(n); return daysFromCivil(c.y, c.m, 1); }
  function nextMonthStart(n) { const c = civilFromDays(n); return c.m === 12 ? daysFromCivil(c.y + 1, 1, 1) : daysFromCivil(c.y, c.m + 1, 1); }

  // ───────────────────────── Helpers ─────────────────────────
  const round = (x, p = 1) => (x == null || !isFinite(x) ? null : Math.round(x * 10 ** p) / 10 ** p);
  function median(arr) {
    if (!arr.length) return null;
    const s = [...arr].sort((a, b) => a - b);
    const mid = Math.floor(s.length / 2);
    return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
  }
  function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null; }
  function stdev(arr) {
    if (arr.length < 2) return null;
    const m = mean(arr);
    return Math.sqrt(arr.reduce((a, b) => a + (b - m) ** 2, 0) / (arr.length - 1));
  }
  function pearson(xs, ys) {
    const n = xs.length;
    if (n < 5) return null;
    const mx = mean(xs), my = mean(ys);
    let num = 0, dx = 0, dy = 0;
    for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); dx += (xs[i] - mx) ** 2; dy += (ys[i] - my) ** 2; }
    if (dx === 0 || dy === 0) return null;
    return num / Math.sqrt(dx * dy);
  }

  // ───────────────────────── Spec helpers ─────────────────────────
  const PERIOD_TYPES = ['perWeek', 'perMonth'];

  function normalizeSpec(spec) {
    const versions = [...(spec.versions || [])]
      .map(v => ({ ...v, from: typeof v.effectiveFrom === 'string' ? dayFromString(v.effectiveFrom) : v.effectiveFrom }))
      .sort((a, b) => a.from - b.from);
    return {
      ...spec,
      start: dayFromString(spec.startDay),
      end: spec.endDay ? dayFromString(spec.endDay) : null,
      pauseRanges: (spec.pauses || []).map(p => ({ from: dayFromString(p.from), to: p.to ? dayFromString(p.to) : null })),
      versionsN: versions,
      weekStart: spec.weekStart ?? 0,
    };
  }
  /** Version (goal/schedule definition) that was in force on `day`. Future edits never rewrite the past. */
  function versionAt(ns, day) {
    let v = ns.versionsN[0];
    for (const x of ns.versionsN) if (x.from <= day) v = x;
    return v;
  }
  function isPaused(ns, day) { return ns.pauseRanges.some(p => day >= p.from && (p.to == null || day <= p.to)); }
  function isActiveDay(ns, day) { return day >= ns.start && (ns.end == null || day <= ns.end) && !isPaused(ns, day); }
  function goalValue(v) {
    const t = v.target || {};
    return t.normal ?? t.min ?? null;
  }

  // ───────────────────────── Event log fold ─────────────────────────
  /**
   * Events are append-only. Entry-creating actions: log, lapse, clean, rest.
   * Modifying actions: undo (removes an entry), correct (replaces fields of an entry).
   * Duplicate event ids are ignored → a retried widget tap can never double count.
   */
  function foldEvents(events) {
    const seen = new Set();
    const entries = new Map();
    const sorted = [...events].sort((a, b) => (a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : (a.id < b.id ? -1 : 1)));
    let duplicates = 0;
    for (const e of sorted) {
      if (seen.has(e.id)) { duplicates++; continue; }
      seen.add(e.id);
      const day = typeof e.day === 'string' ? dayFromString(e.day) : e.day;
      switch (e.action) {
        case 'log': case 'lapse': case 'clean': case 'rest':
          if (!entries.has(e.entryID)) {
            entries.set(e.entryID, { id: e.entryID, kind: e.action, day, ts: e.ts, value: e.value ?? null, duration: e.duration ?? null, quality: e.quality ?? null, source: e.source || 'manual', removed: false, corrections: 0 });
          }
          break;
        case 'undo': {
          const en = entries.get(e.entryID); if (en) en.removed = true; break;
        }
        case 'correct': {
          const en = entries.get(e.entryID);
          if (en) {
            if ('value' in e) en.value = e.value;
            if ('duration' in e) en.duration = e.duration;
            if ('quality' in e) en.quality = e.quality;
            en.corrections++;
          }
          break;
        }
      }
    }
    const byDay = new Map();
    for (const en of entries.values()) {
      if (en.removed) continue;
      let d = byDay.get(en.day);
      if (!d) { d = { completions: 0, value: 0, hasValue: false, duration: 0, hasDuration: false, qualities: [], lapses: 0, clean: false, rest: false, times: [] }; byDay.set(en.day, d); }
      if (en.kind === 'log') {
        d.completions++;
        if (en.value != null) { d.value += en.value; d.hasValue = true; }
        if (en.duration != null) { d.duration += en.duration; d.hasDuration = true; }
        if (en.quality != null) d.qualities.push(en.quality);
        d.times.push(en.ts);
      } else if (en.kind === 'lapse') { d.lapses += Math.max(1, en.value ?? 1); }
      else if (en.kind === 'clean') d.clean = true;
      else if (en.kind === 'rest') d.rest = true;
    }
    return { byDay, entries, duplicates };
  }

  // ───────────────────────── Day status ─────────────────────────
  // Statuses: done | partial | missed | pending | future | unscheduled | rest | nodata | inactive
  function dayAmount(kind, agg) {
    if (!agg) return 0;
    if (kind === 'quantity') return agg.value;
    if (kind === 'duration') return agg.duration;
    return agg.completions;
  }

  function evaluateDay(ns, byDay, day, today) {
    if (!isActiveDay(ns, day)) return { status: 'inactive' };
    const v = versionAt(ns, day);
    const agg = byDay.get(day);
    const sched = v.schedule || { type: 'daily' };
    if (PERIOD_TYPES.includes(sched.type)) {
      // Day is never individually "missed" for flexible schedules.
      return { status: agg && agg.completions > 0 ? 'done' : (day > today ? 'future' : 'unscheduled'), flexible: true };
    }
    if (agg && agg.rest) return { status: 'rest' };
    let scheduled = true;
    if (sched.type === 'weekdays') scheduled = (sched.days || []).includes(weekday(day));
    else if (sched.type === 'interval') scheduled = ((day - ns.start) % Math.max(1, sched.every || 1)) === 0;
    if (!scheduled) return { status: (agg && (agg.completions > 0)) ? 'bonus' : 'unscheduled' };
    if (day > today) return { status: 'future' };

    const kind = ns.kind;
    let result;
    if (kind === 'avoidance') {
      const allowed = v.allowedLapses ?? 0;
      if (agg && agg.lapses > allowed) result = 'missed';
      else if (agg && (agg.clean || agg.lapses > 0)) result = 'done';
      else result = day === today ? 'pending' : 'nodata';
      return { status: result, lapses: agg ? agg.lapses : 0 };
    }
    if (kind === 'range') {
      // Target range: the day's measured value must be between min and max (both optional)
      if (!agg || !agg.hasValue) return { status: day === today ? 'pending' : 'nodata' };
      const r = v.range || {}, val = agg.value;
      const low = r.min != null && val < r.min, high = r.max != null && val > r.max;
      const deviation = low ? round(r.min - val, 2) : high ? round(val - r.max, 2) : 0;
      return { status: low || high ? 'missed' : 'done', progress: low || high ? 0 : 1, value: val, side: low ? 'low' : high ? 'high' : null, deviation };
    }
    let progress;
    if (kind === 'event') {
      // Event-based: every occurrence is its own entry; goal is either a number of events or a total amount
      const goal = goalValue(v) ?? 1;
      const amt = v.eventGoal === 'amount' ? (agg ? agg.value : 0) : (agg ? agg.completions : 0);
      progress = goal > 0 ? amt / goal : (amt > 0 ? 1 : 0);
    } else if (kind === 'quantity' || kind === 'duration') {
      const goal = goalValue(v) ?? 1;
      const amt = dayAmount(kind, agg);
      progress = goal > 0 ? amt / goal : (amt > 0 ? 1 : 0);
    } else if (kind === 'quality') {
      progress = agg && agg.qualities.length > 0 ? 1 : (agg && agg.completions > 0 ? 1 : 0);
    } else {
      const need = Math.max(1, v.timesPerDay || 1);
      progress = (agg ? agg.completions : 0) / need;
    }
    if (progress >= 1) result = 'done';
    else if (day === today) result = 'pending';
    else if (progress > 0) result = 'partial';
    else result = 'missed';
    return { status: result, progress: Math.min(progress, 1), rawProgress: progress };
  }

  // ───────────────────────── Occurrences ─────────────────────────
  /** Planned occurrences in [from, to]. Each: {key, from, to, status, unit:'day'|'week'|'month'} */
  function occurrences(ns, byDay, from, to, today) {
    const out = [];
    let d = from;
    while (d <= to) {
      if (!isActiveDay(ns, d) && !periodOverlapsActive(ns, d)) { d++; continue; }
      const v = versionAt(ns, d);
      const sched = v.schedule || { type: 'daily' };
      if (PERIOD_TYPES.includes(sched.type)) {
        const pStart = sched.type === 'perWeek' ? weekStartOf(d, ns.weekStart) : monthStartOf(d);
        const pEnd = sched.type === 'perWeek' ? pStart + 6 : nextMonthStart(d) - 1;
        const need = Math.max(1, sched.count || 1);
        let count = 0, activeDays = 0;
        for (let x = pStart; x <= pEnd; x++) {
          if (!isActiveDay(ns, x)) continue;
          activeDays++;
          const a = byDay.get(x); if (a && a.completions > 0) count++;   // yes/no per day: a day counts once
        }
        let status;
        if (activeDays === 0) status = null;
        else if (count >= need) status = 'done';
        else if (pEnd >= today) status = 'pending';
        else status = count > 0 ? 'partial' : 'missed';
        if (status) out.push({ key: pStart, from: pStart, to: pEnd, status, count, need, unit: sched.type === 'perWeek' ? 'week' : 'month' });
        d = pEnd + 1;
        continue;
      }
      const ev = evaluateDay(ns, byDay, d, today);
      if (['done', 'partial', 'missed', 'pending', 'nodata'].includes(ev.status)) out.push({ key: d, from: d, to: d, status: ev.status, progress: ev.progress, unit: 'day' });
      d++;
    }
    return out;
  }
  function periodOverlapsActive(ns, d) {
    const v = versionAt(ns, d);
    const sched = (v && v.schedule) || {};
    if (!PERIOD_TYPES.includes(sched.type)) return false;
    const pStart = sched.type === 'perWeek' ? weekStartOf(d, ns.weekStart) : monthStartOf(d);
    const pEnd = sched.type === 'perWeek' ? pStart + 6 : nextMonthStart(d) - 1;
    for (let x = pStart; x <= pEnd; x++) if (isActiveDay(ns, x)) return true;
    return false;
  }

  /** Counting rule: an occurrence is "planned" once it is done, or once it is over. Pending today never counts as a miss. */
  function tally(occs) {
    let done = 0, missed = 0, partial = 0, pending = 0, nodata = 0;
    for (const o of occs) {
      if (o.status === 'done') done++;
      else if (o.status === 'missed') missed++;
      else if (o.status === 'partial') partial++;
      else if (o.status === 'pending') pending++;
      else if (o.status === 'nodata') nodata++;
    }
    const planned = done + missed + partial;
    return {
      completed: done, missed, partial, pending, noData: nodata, planned,
      successRate: planned > 0 ? round(done / planned * 100) : null,
      missRate: planned > 0 ? round((missed + partial) / planned * 100) : null,
    };
  }

  function streaks(occs) {
    let best = 0, run = 0;
    const closed = occs.filter(o => o.status !== 'pending' && o.status !== 'nodata');
    for (const o of closed) {
      if (o.status === 'done') { run++; best = Math.max(best, run); } else run = 0;
    }
    return { current: run, best };
  }

  // ───────────────────────── Analysis ─────────────────────────
  /**
   * analyze(spec, events, {from, to, today}) → full metric report for one habit.
   * from/to/today are 'YYYY-MM-DD'. `to` is clipped to today.
   */
  function analyze(spec, events, opts) {
    const ns = normalizeSpec(spec);
    const today = dayFromString(opts.today);
    const from = Math.max(dayFromString(opts.from), ns.start);
    const to = Math.min(dayFromString(opts.to), today);
    const { byDay, duplicates } = foldEvents(events.filter(e => e.habitID == null || e.habitID === spec.id));
    const unitInfo = (versionAt(ns, to).schedule || {}).type;
    const basis = {
      from: dayToString(from), to: dayToString(to), today: opts.today,
      unit: PERIOD_TYPES.includes(unitInfo) ? (unitInfo === 'perWeek' ? 'week' : 'month') : 'day',
    };
    if (from > to) {
      return { habitID: spec.id, kind: spec.kind, basis, ...tally([]), streak: { current: 0, best: 0 }, insufficient: true, duplicatesIgnored: duplicates };
    }
    const occs = occurrences(ns, byDay, from, to, today);
    const allOccs = occurrences(ns, byDay, ns.start, today, today);
    const t = tally(occs);
    const st = streaks(allOccs);

    // Day composition inside the window
    let fullDays = 0, partialDays = 0, unscheduledDays = 0, restDays = 0, noDataDays = 0, missedDays = 0;
    for (let d = from; d <= to; d++) {
      const s = evaluateDay(ns, byDay, d, today).status;
      if (s === 'done') fullDays++; else if (s === 'partial') partialDays++;
      else if (s === 'unscheduled' || s === 'bonus') unscheduledDays++; else if (s === 'rest') restDays++;
      else if (s === 'nodata') noDataDays++; else if (s === 'missed') missedDays++;
    }
    let totalCompletions = 0;
    for (let d = from; d <= to; d++) { const a = byDay.get(d); if (a) totalCompletions += spec.kind === 'frequency' ? (a.completions > 0 ? 1 : 0) : a.completions; }   // X per week: yes/no per day

    const report = {
      habitID: spec.id, kind: spec.kind, basis, ...t,
      streak: st, fullDays, partialDays, missedDays, unscheduledDays, restDays, noDataDays,
      totalCompletions, duplicatesIgnored: duplicates,
    };

    // Amount metrics (quantity / duration / composite with values)
    const amountField = spec.kind === 'duration' ? 'duration' : 'value';
    const wantAmounts = spec.kind === 'quantity' || spec.kind === 'duration' || spec.kind === 'composite' || spec.kind === 'event' || spec.kind === 'range';
    if (wantAmounts) report.amount = amountStats(ns, byDay, from, to, today, amountField, spec.kind === 'composite' ? null : spec.kind);
    if (spec.kind === 'composite') report.durationStats = amountStats(ns, byDay, from, to, today, 'duration', null);

    // Quality
    const qs = [], qd = [];
    for (let d = from; d <= to; d++) {
      const a = byDay.get(d); if (!a) continue;
      for (const q of a.qualities) qs.push(q);
      if (a.qualities.length && a.hasDuration) { qd.push([a.duration, mean(a.qualities)]); }
    }
    if (qs.length || spec.kind === 'quality') {
      const scale = versionAt(ns, to).qualityScale || 5;
      const dist = {}; for (let i = 1; i <= scale; i++) dist[i] = 0; for (const q of qs) dist[q] = (dist[q] || 0) + 1;
      const half = Math.floor(qs.length / 2);
      report.quality = {
        count: qs.length, scale,
        mean: round(mean(qs), 2),
        distribution: dist,
        highShare: qs.length ? round(qs.filter(q => q >= Math.ceil(scale * 0.8)).length / qs.length * 100) : null,
        change: qs.length >= 4 ? round(mean(qs.slice(half)) - mean(qs.slice(0, half)), 2) : null,
        durationCorrelation: round(pearson(qd.map(x => x[0]), qd.map(x => x[1])), 2),
      };
    }

    // Avoidance
    if (spec.kind === 'avoidance') {
      let lapses = 0; const lapseDays = [];
      for (let d = ns.start; d <= to; d++) { const a = byDay.get(d); if (a && a.lapses > 0) { if (d >= from) lapses += a.lapses; lapseDays.push(d); } }
      const gaps = []; for (let i = 1; i < lapseDays.length; i++) gaps.push(lapseDays[i] - lapseDays[i - 1]);
      report.avoidance = {
        lapses, successfulDays: t.completed, unknownDays: t.noData,
        meanDaysBetween: round(mean(gaps)),
        daysSinceLast: lapseDays.length ? today - lapseDays[lapseDays.length - 1] : null,
        note: t.noData > 0 ? 'ימים ללא דיווח אינם נספרים כהצלחה או ככישלון' : null,
      };
    }

    // Event-based tracking: each occurrence on its own
    if (spec.kind === 'event') report.events = eventStats(ns, events.filter(e => e.habitID == null || e.habitID === spec.id), from, to);
    // Target range: in range / below / above
    if (spec.kind === 'range') {
      let measured = 0, inRange = 0, below = 0, above = 0; const devs = [], series = [];
      for (let d = from; d <= to; d++) {
        const e = evaluateDay(ns, byDay, d, today);
        if (e.value == null) continue;
        measured++; series.push({ day: dayToString(d), value: e.value, side: e.side });
        if (e.side === 'low') { below++; devs.push(e.deviation); } else if (e.side === 'high') { above++; devs.push(e.deviation); } else inRange++;
      }
      const dist = series.map(x => { const r = versionAt(ns, dayFromString(x.day)).range || {}; return x.side === 'low' ? r.min - x.value : x.side === 'high' ? x.value - r.max : 0; });
      const half = Math.floor(dist.length / 2);
      const trendDelta = dist.length >= 4 ? round(mean(dist.slice(half)) - mean(dist.slice(0, half)), 2) : null;
      const r = versionAt(ns, to).range || {};
      report.range = {
        min: r.min ?? null, max: r.max ?? null, measured, inRange, below, above,
        inRangeRate: measured ? round(inRange / measured * 100) : null,
        meanDeviation: devs.length ? round(mean(devs), 2) : 0,
        maxDeviation: devs.length ? Math.max(...devs) : 0,
        mean: series.length ? round(mean(series.map(x => x.value)), 2) : null,
        trend: trendDelta == null ? 'insufficient' : trendDelta < -0.05 ? 'closer' : trendDelta > 0.05 ? 'farther' : 'stable',
        series,
      };
    }

    // Frequency progress (current period)
    const curV = versionAt(ns, today); const cs = curV.schedule || {};
    if (PERIOD_TYPES.includes(cs.type)) {
      const cur = occurrences(ns, byDay, today, today, today)[0];
      if (cur) report.period = { count: cur.count, need: cur.need, remaining: Math.max(0, cur.need - cur.count), from: dayToString(cur.from), to: dayToString(cur.to), unit: cur.unit };
    }

    report.score = scores(spec, report);
    return report;
  }

  /** Event stats over [from, to]: count, total, average per event, gaps between events, hours, vs previous window. */
  function eventStats(ns, events, from, to) {
    const { entries } = foldEvents(events);
    const list = [...entries.values()].filter(x => !x.removed && x.kind === 'log').sort((a, b) => (a.ts < b.ts ? -1 : 1));
    const inWin = list.filter(x => x.day >= from && x.day <= to);
    const len = to - from + 1, prev = list.filter(x => x.day >= from - len && x.day < from && x.day >= ns.start);
    const vals = inWin.filter(x => x.value != null).map(x => x.value);
    const durs = inWin.filter(x => x.duration != null).map(x => x.duration);
    const gaps = []; const byDay = {};
    for (const x of inWin) (byDay[x.day] = byDay[x.day] || []).push(x);
    for (const k of Object.keys(byDay)) { const a = byDay[k]; for (let i = 1; i < a.length; i++) { const g = (new Date(a[i].ts) - new Date(a[i - 1].ts)) / 60000; if (g >= 0) gaps.push(g); } }
    const hours = Array(24).fill(0); for (const x of inWin) { const h = new Date(x.ts).getHours(); if (!isNaN(h)) hours[h]++; }
    const activeDays = Object.keys(byDay).length;
    let peak = null; hours.forEach((n, h) => { if (n && (peak == null || n > hours[peak])) peak = h; });
    return {
      count: inWin.length, total: round(vals.reduce((a, b) => a + b, 0), 2), totalDuration: round(durs.reduce((a, b) => a + b, 0), 2),
      meanPerEvent: vals.length ? round(mean(vals), 2) : null,
      meanPerActiveDay: activeDays ? round(inWin.length / activeDays, 2) : null,
      meanGapMinutes: gaps.length ? round(mean(gaps)) : null,
      activeDays, hours, peakHour: peak,
      previousCount: prev.length,
      changeVsPrevious: prev.length ? round((inWin.length - prev.length) / prev.length * 100) : null,
    };
  }

  function amountStats(ns, byDay, from, to, today, field, kindForGoal) {
    const vals = []; let plannedDays = 0; const attain = [];
    const hasKey = field === 'duration' ? 'hasDuration' : 'hasValue';
    for (let d = from; d <= to; d++) {
      const a = byDay.get(d);
      const amt = a && a[hasKey] ? a[field] : 0;
      if (a && a[hasKey]) vals.push(amt);
      const ev = evaluateDay(ns, byDay, d, today);
      if (['done', 'partial', 'missed'].includes(ev.status)) {
        plannedDays++;
        const g = goalValue(versionAt(ns, d));
        if (kindForGoal && g) attain.push(Math.min(amt / g, 1));
      }
    }
    const total = vals.reduce((x, y) => x + y, 0);
    // previous window of identical length
    const len = to - from + 1; let prevTotal = 0; let prevHas = false;
    for (let d = from - len; d < from; d++) { if (d < ns.start) continue; prevHas = true; const a = byDay.get(d); if (a && a[hasKey]) prevTotal += a[field]; }
    let best = null; for (const [, a] of byDay) if (a[hasKey]) best = best == null ? a[field] : Math.max(best, a[field]);
    const v = versionAt(ns, to); const t = v.target || {};
    return {
      total: round(total, 2), sessions: vals.length,
      meanPerActiveDay: round(mean(vals), 2),
      meanPerPlannedDay: plannedDays ? round(total / plannedDays, 2) : null,
      median: round(median(vals), 2), min: vals.length ? Math.min(...vals) : null, max: vals.length ? Math.max(...vals) : null,
      personalBest: best,
      targetAttainment: attain.length ? round(mean(attain) * 100) : null,
      changeVsPrevious: prevHas && prevTotal > 0 ? round((total - prevTotal) / prevTotal * 100) : null,
      unit: v.unit || (field === 'duration' ? 'דק׳' : ''),
      targets: { min: t.min ?? null, normal: t.normal ?? null, advanced: t.advanced ?? null },
      levelToday: levelFor(byDay.get(today), field, hasKey, t),
    };
  }
  function levelFor(a, field, hasKey, t) {
    const amt = a && a[hasKey] ? a[field] : 0;
    if (t.advanced != null && amt >= t.advanced) return 'advanced';
    if (t.normal != null && amt >= t.normal) return 'normal';
    if (t.min != null && amt >= t.min) return 'min';
    return amt > 0 ? 'started' : 'none';
  }

  // ───────────────────────── Scores ─────────────────────────
  /** Adherence score = success rate. Overall score uses only the components that exist for this habit. */
  function scores(spec, r) {
    const w = { adherence: 50, target: 30, quality: 20, ...(spec.scoreWeights || {}) };
    const comps = [];
    if (r.successRate != null) comps.push({ key: 'adherence', label: 'עמידה ביעד', value: r.successRate, weight: w.adherence });
    if (r.amount && r.amount.targetAttainment != null) comps.push({ key: 'target', label: 'השגת יעד כמותי', value: r.amount.targetAttainment, weight: w.target });
    if (r.quality && r.quality.mean != null) comps.push({ key: 'quality', label: 'איכות', value: round(r.quality.mean / r.quality.scale * 100), weight: w.quality });
    const tw = comps.reduce((a, c) => a + c.weight, 0);
    const normalized = comps.map(c => ({ ...c, weight: tw ? round(c.weight / tw * 100) : 0 }));
    return {
      adherence: r.successRate,
      overall: r.successRate == null || !tw ? null : round(comps.reduce((a, c) => a + c.value * c.weight, 0) / tw),
      components: normalized,
    };
  }

  // ───────────────────────── Trends ─────────────────────────
  /** Compare the last `window` days with the window before it. */
  function trend(spec, events, opts) {
    const win = opts.window || 30;
    const today = dayFromString(opts.today);
    const cur = analyze(spec, events, { from: dayToString(today - win + 1), to: opts.today, today: opts.today });
    const prev = analyze(spec, events, { from: dayToString(today - 2 * win + 1), to: dayToString(today - win), today: opts.today });
    const minN = opts.minPlanned ?? (cur.basis.unit === 'day' ? Math.min(6, Math.ceil(win / 5)) : 2);
    let direction = 'insufficient', delta = null;
    if (cur.planned >= minN && prev.planned >= minN && cur.successRate != null && prev.successRate != null) {
      delta = round(cur.successRate - prev.successRate);
      direction = delta >= 10 ? 'up' : delta <= -10 ? 'down' : 'stable';
    }
    // 7-day moving average + volatility over weekly rates
    const ns = normalizeSpec(spec); const { byDay } = foldEvents(events.filter(e => e.habitID == null || e.habitID === spec.id));
    const series = [];
    for (let d = today - win + 1; d <= today; d++) {
      const s = evaluateDay(ns, byDay, d, today).status;
      series.push({ day: dayToString(d), v: s === 'done' ? 1 : (s === 'partial' || s === 'missed') ? 0 : null });
    }
    const ma = series.map((p, i) => {
      const w = series.slice(Math.max(0, i - 6), i + 1).map(x => x.v).filter(x => x != null);
      return { day: p.day, value: w.length ? round(mean(w) * 100) : null };
    });
    const weekly = [];
    for (let i = 0; i + 7 <= series.length; i += 7) {
      const w = series.slice(i, i + 7).map(x => x.v).filter(x => x != null);
      if (w.length) weekly.push(mean(w) * 100);
    }
    return { window: win, current: cur.successRate, previous: prev.successRate, currentPlanned: cur.planned, previousPlanned: prev.planned, currentDone: cur.completed, previousDone: prev.completed, delta, direction, movingAverage: ma, volatility: round(stdev(weekly)) };
  }

  /** Success rate per weekday and completion count per hour (all history up to today). */
  function patterns(spec, events, opts) {
    const ns = normalizeSpec(spec); const today = dayFromString(opts.today);
    const { byDay } = foldEvents(events.filter(e => e.habitID == null || e.habitID === spec.id));
    const wd = Array.from({ length: 7 }, () => ({ done: 0, planned: 0 }));
    for (let d = ns.start; d <= today; d++) {
      const s = evaluateDay(ns, byDay, d, today).status;
      if (s === 'done') { wd[weekday(d)].done++; wd[weekday(d)].planned++; }
      else if (s === 'missed' || s === 'partial') wd[weekday(d)].planned++;
    }
    const hours = Array(24).fill(0);
    for (const [, a] of byDay) for (const ts of a.times) { const h = new Date(ts).getHours(); if (!isNaN(h)) hours[h]++; }
    return { weekdays: wd.map((x, i) => ({ weekday: i, ...x, rate: x.planned ? round(x.done / x.planned * 100) : null })), hours };
  }

  // ───────────────────────── Multi-habit ─────────────────────────
  /** Today's dashboard: day-level habits scheduled today form the denominator. Flexible (per-week) habits are shown but not counted. */
  function todaySummary(specs, events, todayStr) {
    const today = dayFromString(todayStr);
    const items = specs.map(spec => {
      const ns = normalizeSpec(spec);
      const { byDay } = foldEvents(events.filter(e => e.habitID === spec.id));
      const ev = evaluateDay(ns, byDay, today, today);
      const agg = byDay.get(today);
      const v = versionAt(ns, today);
      // Flexible (X per week/month): is this period's target already reached?
      let periodMet = false, periodCount = 0, periodNeed = 0;
      if (ev.flexible) { const o = occurrences(ns, byDay, today, today, today)[0]; if (o) { periodMet = o.status === 'done'; periodCount = o.count; periodNeed = o.need; } }
      const need = (spec.kind === 'binary' || spec.kind === 'composite') ? Math.max(1, v.timesPerDay || 1) : 1;
      return { id: spec.id, status: ev.status, progress: ev.progress ?? (ev.status === 'done' ? 1 : 0), flexible: !!ev.flexible, completionsToday: agg ? agg.completions : 0, amountToday: agg ? (spec.kind === 'duration' ? agg.duration : agg.value) : 0, need, periodMet, periodCount, periodNeed, goal: (spec.kind === 'quantity' || spec.kind === 'duration' || spec.kind === 'event') ? goalValue(v) : null, value: ev.value ?? null, side: ev.side ?? null, deviation: ev.deviation ?? null };
    });
    const counted = items.filter(i => !i.flexible && ['done', 'pending', 'missed', 'partial', 'nodata'].includes(i.status));
    const done = counted.filter(i => i.status === 'done').length;
    return { items, planned: counted.length, done, remaining: counted.length - done, percent: counted.length ? Math.round(done / counted.length * 100) : null };
  }

  /** Per-day aggregate across habits for the calendar heatmap. */
  function heatmap(specs, events, fromStr, toStr, todayStr) {
    const today = dayFromString(todayStr), from = dayFromString(fromStr), to = dayFromString(toStr);
    const prepared = specs.map(s => ({ ns: normalizeSpec(s), byDay: foldEvents(events.filter(e => e.habitID === s.id)).byDay }));
    const out = [];
    for (let d = from; d <= to; d++) {
      let done = 0, planned = 0, completions = 0, unknown = 0;
      for (const p of prepared) {
        const s = evaluateDay(p.ns, p.byDay, d, today).status;
        if (s === 'done' && !evaluateDay(p.ns, p.byDay, d, today).flexible) { done++; planned++; }
        else if (s === 'missed' || s === 'partial') planned++;
        else if (s === 'nodata') unknown++;
        const a = p.byDay.get(d); if (a) completions += a.completions;
      }
      let state;
      if (d > today) state = 'future';
      else if (planned === 0) state = unknown ? 'nodata' : (completions ? 'bonus' : 'noplan');
      else state = done === planned ? 'full' : done > 0 ? 'partial' : 'missed';
      out.push({ day: dayToString(d), weekday: weekday(d), done, planned, completions, ratio: planned ? done / planned : null, state });
    }
    return out;
  }

  /** Weighted overall rate across habits (operational metric, not a measure of character). */
  function overall(specs, events, opts) {
    let wsum = 0, acc = 0, done = 0, planned = 0;
    const reports = specs.map(s => analyze(s, events, opts));
    reports.forEach((r, i) => {
      done += r.completed; planned += r.planned;
      if (r.successRate != null) { const w = specs[i].weight ?? 1; wsum += w; acc += r.successRate * w; }
    });
    return { weightedRate: wsum ? round(acc / wsum) : null, completed: done, planned, simpleRate: planned ? round(done / planned * 100) : null, reports };
  }

  // ───────────────────────── Goals & achievements ─────────────────────────
  function goalProgress(goal, specs, events, todayStr) {
    const today = dayFromString(todayStr);
    const linked = specs.filter(s => goal.habitIDs.includes(s.id));
    const to = goal.endDay ? Math.min(dayFromString(goal.endDay), today) : today;
    const opts = { from: goal.startDay, to: dayToString(to), today: todayStr };
    let value = 0;
    if (goal.metric === 'completions') value = linked.reduce((a, s) => a + analyze(s, events, opts).totalCompletions, 0);
    else if (goal.metric === 'amount') value = linked.reduce((a, s) => a + ((analyze(s, events, opts).amount || {}).total || 0), 0);
    else if (goal.metric === 'streak') value = Math.min(...linked.map(s => analyze(s, events, opts).streak.current));
    else if (goal.metric === 'successRate') { const o = overall(linked, events, opts); value = o.weightedRate ?? 0; }
    const pct = goal.target > 0 ? Math.min(100, round(value / goal.target * 100)) : 0;
    const milestones = (goal.milestones || [25, 50, 75, 100]).map(m => ({ at: m, reached: pct >= m }));
    return { value: round(value, 2), target: goal.target, percent: pct, milestones, achieved: pct >= 100 };
  }

  function achievements(specs, events, todayStr) {
    const list = [];
    let total = 0, bestStreak = 0, comeback = false;
    const today = dayFromString(todayStr);
    for (const s of specs) {
      const ns = normalizeSpec(s); const { byDay } = foldEvents(events.filter(e => e.habitID === s.id));
      for (const [, a] of byDay) total += a.completions;
      const occs = occurrences(ns, byDay, ns.start, today, today);
      bestStreak = Math.max(bestStreak, streaks(occs).best);
      let misses = 0;
      for (const o of occs) { if (o.status === 'missed') misses++; else if (o.status === 'done') { if (misses >= 3) comeback = true; misses = 0; } }
    }
    const add = (id, title, desc, ok, progress) => list.push({ id, title, desc, unlocked: ok, progress });
    add('first', 'צעד ראשון', 'סימון ראשון של הרגל', total >= 1, Math.min(1, total));
    add('streak7', 'שבוע רצוף', 'רצף של 7 מועדים', bestStreak >= 7, Math.min(1, bestStreak / 7));
    add('streak30', 'חודש רצוף', 'רצף של 30 מועדים', bestStreak >= 30, Math.min(1, bestStreak / 30));
    add('streak100', 'מאה', 'רצף של 100 מועדים', bestStreak >= 100, Math.min(1, bestStreak / 100));
    add('c100', '100 ביצועים', 'סך 100 השלמות', total >= 100, Math.min(1, total / 100));
    add('comeback', 'חזרה לשגרה', 'השלמה אחרי 3 החמצות ברצף — חזרה היא ההישג', comeback, comeback ? 1 : 0);
    const level = Math.floor(Math.sqrt(total / 5)) + 1;
    const nextAt = 5 * level * level;
    return { list, totalCompletions: total, level, nextLevelAt: nextAt, bestStreak };
  }

  // ───────────────────────── Insights (rule-based, labelled) ─────────────────────────
  /** Each insight states whether it is a measured fact or a hypothesis, and on what data. Never causal. */
  function insights(specs, events, todayStr, names) {
    const out = [];
    for (const s of specs) {
      const name = (names && names[s.id]) || s.name || s.id;
      const tr = trend(s, events, { today: todayStr, window: 30 });
      if (tr.direction === 'up') out.push({ habitID: s.id, type: 'improving', certainty: 'measured', text: `${name}: בוצע ${tr.currentDone} פעמים ב-30 הימים האחרונים, לעומת ${tr.previousDone} ב-30 שלפניהם`, basis: `${tr.currentPlanned} מול ${tr.previousPlanned} מועדים מתוכננים` });
      if (tr.direction === 'down') out.push({ habitID: s.id, type: 'declining', certainty: 'measured', text: `${name}: בוצע ${tr.currentDone} פעמים ב-30 הימים האחרונים, לעומת ${tr.previousDone} ב-30 שלפניהם`, basis: `${tr.currentPlanned} מול ${tr.previousPlanned} מועדים מתוכננים` });
      const r30 = analyze(s, events, { from: dayToString(dayFromString(todayStr) - 29), to: todayStr, today: todayStr });
      if (r30.planned >= 10 && r30.successRate != null && r30.successRate < 40) out.push({ habitID: s.id, type: 'ambitious', certainty: 'hypothesis', text: `${name}: ייתכן שהיעד שאפתני מדי — אפשר לשקול יעד מינימלי נמוך יותר או פחות ימים בשבוע`, basis: `${r30.completed} מתוך ${r30.planned} מועדים ב-30 יום` });
      const p = patterns(s, events, { today: todayStr });
      const valid = p.weekdays.filter(w => w.planned >= 4);
      if (valid.length >= 3) {
        const best = valid.reduce((a, b) => (b.rate > a.rate ? b : a)); const worst = valid.reduce((a, b) => (b.rate < a.rate ? b : a));
        if (best.rate - worst.rate >= 30) out.push({ habitID: s.id, type: 'weekday', certainty: 'hypothesis', text: `${name}: ביום ${WEEKDAYS[worst.weekday]} בוצע ${worst.done} מתוך ${worst.planned} פעמים, וביום ${WEEKDAYS[best.weekday]} ${best.done} מתוך ${best.planned}. זה מתאם, לא בהכרח סיבה`, basis: 'כל ההיסטוריה' });
      }
      const totalTimes = p.hours.reduce((a, b) => a + b, 0);

      const counts = {}; r.missed.forEach(x => { const k = E.weekday(x.d); counts[k] = (counts[k] || 0) + 1; });
      const weekend = r.missed.filter(x => [5, 6].includes(E.weekday(x.d))).length;
      if (weekend && weekend >= r.missed.length / 2) tips.push(`רוב הפספוסים היו בסוף השבוע (${r.missed.filter(x => [5, 6].includes(E.weekday(x.d))).map(x => wd(x.d)).join(', ')}). בשישי־שבת השגרה משתנה — קבע לזה שעה קבועה או תזכורת מיוחדת לסופ״ש.`);
      else tips.push(`פספסת ב: ${r.missed.map(x => `יום ${wd(x.d)}`).join(', ')}. חשוב מה היה שונה בימים האלה, ותכנן מראש את אותם ימים בשבוע הבא.`);
    }
    if (r.unreported.length >= 2) tips.push(`${r.unreported.length} ימים בכלל לא סומנו. אם עשית ושכחת לסמן — הפעל תזכורת בערב${h.reminder ? '' : ' (כרגע אין תזכורת להרגל הזה)'}.`);
    else if (r.missed.length && !h.reminder) tips.push('אין להרגל הזה תזכורת. תזכורת בשעה קבועה תעזור לא לשכוח.');
  }
  if (r.isAmt && r.goal && r.goal - r.avg >= (h.kind === 'duration' ? 1 : 0.5) && (r.missed.length || r.flexible)) {
    const gap = r.goal - r.avg;
    tips.push(h.kind === 'duration'
      ? `בממוצע ${fmtMin(r.avg)} ביום מתוך ${fmtMin(r.goal)} — חסרות כ-${fmtMin(gap)}. נסה לחלק לשני חלקים (בוקר וערב), או להשתמש במצב פוקוס.`
      : `בממוצע ${amt(r.avg)} ביום מתוך ${amt(r.goal)} — חסרות כ-${amt(gap)}. הוסף ${Math.ceil(gap)} ${versionNow(h).unit || 'יחידות'} בשעות קבועות (למשל אחת בבוקר, אחת בצהריים).`);
  }
  if (h.kind === 'avoidance' && r.lapses) tips.push(`${r.lapses === 1 ? 'הייתה חריגה אחת' : `היו ${r.lapses} חריגות`}. רשום מה גרם לכל אחת, והכן תחליף מראש לרגע הזה.`);
  if (!r.flexible && r.prevNeed && r.done < r.prevDone) tips.push(`ירידה מהשבוע שעבר (${r.prevDone} ← ${r.done} ימים). חזור למה שעבד אז.`);
  if (!tips.length) tips.push('המשך באותו קצב.');
  return tips.slice(0, 4);
}
/** One short fix for next week (the most useful one), from this week's data only. */
function weekFix(r) {
  const { h } = r, L = d => WD[E.weekday(d)];
  if (r.ok) return '';
  if (r.flexible) { const gap = r.need - r.done; return gap > 0 ? `לקבוע מראש ${gap} ${gap === 1 ? 'יום' : 'ימים'} נוספים בלו״ז` : ''; }
  if (r.isAmt && r.goal && r.goal - r.avg >= (h.kind === 'duration' ? 1 : 0.5)) {
    const gap = r.goal - r.avg;
    return h.kind === 'duration' ? `להוסיף כ-${fmtMin(gap)} ביום (לחלק לבוקר וערב)` : `להוסיף כ-${Math.ceil(gap)} ${versionNow(h).unit || 'יחידות'} ביום בשעות קבועות`;
  }
  if (h.kind === 'avoidance' && r.lapses) return 'להכין מראש תחליף לרגעי החריגה';
  if (r.unreported.length >= 2) return 'להפעיל תזכורת בערב — ימים לא סומנו';
  const weekend = r.missed.filter(x => [5, 6].includes(E.weekday(x.d)));
  if (weekend.length && weekend.length * 2 >= r.missed.length) return 'לקבוע שעה קבועה גם בשישי־שבת';
  if (r.missed.length) return `לתכנן מראש את ימי ${r.missed.map(x => L(x.d)).join(', ')}`;
  return '';
}

/** Weekly summary extras: score hero, day-by-day bars, highlights. */
function weekExtras(hs, rows, ws, pe, td) {
  if (!hs.length) return '';
  const we = Math.min(pe, td), DN = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'], DS = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
  const done = rows.reduce((a, r) => a + r.done, 0), need = rows.reduce((a, r) => a + r.need, 0);
  const prevRows = S.habits.filter(h => !h.archived && D(h.startDay) <= ws - 1).map(h => weekReview(h, ws - 7, td, ws - 7 + (we - ws), false));   // same number of days as this week so far
