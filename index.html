  const r = 34, c = 2 * Math.PI * r;
  const cmp = ws - 7 < Math.min(...S.habits.map(h => D(h.startDay))) ? '' : diff > 0 ? `<span class="wx-cmp">▲ ${diff} יותר משבוע שעבר</span>` : diff < 0 ? `<span class="wx-cmp">▼ ${-diff} פחות משבוע שעבר</span>` : '<span class="wx-cmp">בדיוק כמו שבוע שעבר</span>';
  const hero = `<section class="wx-hero" style="--g1:${g1};--g2:${g2}"><i class="blob b1"></i><i class="blob b2"></i>
    <div class="wx-ring"><svg viewBox="0 0 80 80" width="80" height="80"><circle cx="40" cy="40" r="${r}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="8"/><circle cx="40" cy="40" r="${r}" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - frac)).toFixed(1)}" style="--c:${c.toFixed(1)}"/></svg><div class="wx-rv"><b class="num">${done}</b><small>מתוך ${need}</small></div></div>
    <div class="wx-txt"><div class="wx-mood"><span class="wx-em">${em}</span>${mood}</div><div class="wx-sub">${done === 1 ? 'ביצוע אחד' : done + ' ביצועים'} השבוע</div>${cmp}</div></section>`;
  const days = [];
  for (let d = ws; d <= ws + 6; d++) {
    const live = hs.filter(h => D(h.startDay) <= d), cells = live.map(h => calCell(h, d, td));
    days.push({ d, done: d <= we ? cells.filter(x => x.done).length : 0, fut: d > td, today: d === td, wd: new Date(S_(d) + 'T12:00').getDay() });
  }
  const max = Math.max(1, ...days.map(x => x.done)), best = days.filter(x => !x.fut).reduce((a, x) => x.done > (a ? a.done : 0) ? x : a, null);
  const bars = `<section class="card wx-days"><div class="wx-h">יום אחרי יום</div><div class="wx-bars">${days.map(x => `<div class="wx-col ${x.fut ? 'fut' : ''} ${x.today ? 'tod' : ''} ${best && x.d === best.d ? 'best' : ''}"><span class="wx-n num">${x.fut ? '' : x.done}</span><div class="wx-track"><i style="height:${x.fut ? 0 : Math.max(6, Math.round(x.done / max * 100))}%"></i></div><span class="wx-l">${DS[x.wd]}</span></div>`).join('')}</div>
    ${best && best.done ? `<div class="wx-note">⭐ היום הכי חזק: <b>יום ${DN[best.wd]}</b> · ${best.done === 1 ? 'הרגל אחד' : best.done + ' הרגלים'}</div>` : ''}</section>`;
  const scored = rows.filter(x => x.need > 0);

  const weak = scored.filter(x => !x.ok).sort((a, b) => a.done / a.need - b.done / b.need)[0];
  const streaks = hs.map(h => ({ h, n: streakNow(h).current })).sort((a, b) => b.n - a.n)[0];
  const hl = (ic, col, title, body) => `<div class="wx-hl" style="--hc:${col}"><span class="wx-hic">${ic}</span><div class="grow"><small>${title}</small><b>${body}</b></div></div>`;
  const highs = [
    star && star.done ? hl('⭐', star.h.color, 'ההרגל של השבוע', `${esc(star.h.icon)} ${esc(star.h.name)} · <bdi class="num">${star.done}/${star.need}</bdi>`) : '',
    pe >= td && streaks && streaks.n >= 2 ? hl('🔥', streaks.h.color, 'הרצף הכי ארוך', `${esc(streaks.h.icon)} ${esc(streaks.h.name)} · ${streaks.n} ימים`) : '',

function screenWeekly() {

    case 'editList': ui.editList = !ui.editList; ui.confirm = null; rerender(); break;
    case 'askDelete': ui.confirm = 'delete:' + id; rerender(); break;
    case 'cancelConfirm': ui.confirm = null; rerender(); break;
    case 'delete': {
      // Keep a copy for a few seconds so a wrong tap can be undone
      ui.lastDeleted = { habit: h, index: S.habits.indexOf(h), events: S.events.filter(x => x.habitID === id), goals: (S.goals || []).slice(), timer: (S.timers || {})[id] };
      S.habits = S.habits.filter(x => x.id !== id); S.events = S.events.filter(x => x.habitID !== id);
      if (S.timers) delete S.timers[id];
      save(); ui.sheet = null; ui.detail = null; ui.confirm = null;
      if (!S.habits.length) ui.editList = false;
      render(); toast(`״${h.name}״ נמחק`, { label: 'בטל', a: 'undoDelete' }); break;
    }
    case 'undoDelete': {
      const L = ui.lastDeleted; if (!L) break;
      S.habits.splice(Math.max(0, Math.min(L.index, S.habits.length)), 0, L.habit); S.events.push(...L.events); S.goals = L.goals;
      if (L.timer) { S.timers = S.timers || {}; S.timers[L.habit.id] = L.timer; }
      ui.lastDeleted = null; save(); render(); toast(`״${L.habit.name}״ הוחזר`); break;
    }
    case 'q': { const box = document.getElementById('lq'); const val = Number(v); const cur = Number(box.dataset.v); box.dataset.v = cur === val ? 0 : val; box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === Number(box.dataset.v)))); break; }
    case 'submitLog': {
      const day = ui.sheet.day, num = i => { const x = document.getElementById(i); return x && x.value !== '' ? Number(x.value) : null; };
      const value = num('lv'), duration = num('ld'), q = document.getElementById('lq'), quality = q && Number(q.dataset.v) ? Number(q.dataset.v) : null;
      const note = (document.getElementById('ln') || {}).value || undefined;
      if (ui.editEntry) {
        const { entries } = E.foldEvents(eventsOf(h.id)); const en = entries.get(ui.editEntry);
        const extra = { entryID: ui.editEntry, previousValue: en ? (en.value ?? en.duration ?? en.quality) : null };
        if (value != null) extra.value = value; if (duration != null) extra.duration = duration; if (quality != null) extra.quality = quality;
        ev(h, day, 'correct', extra); ui.editEntry = null; toast('התיקון נשמר — הערך הקודם בהיסטוריה');
      } else {
        if (value == null && duration == null && quality == null && ['quantity', 'duration'].includes(h.kind)) { toast('הזן ערך'); break; }
        const extra = {}; if (value != null) extra.value = value; if (duration != null) extra.duration = duration; if (quality != null) extra.quality = quality; if (note) extra.note = note;
        ev(h, day, 'log', extra); toast('נרשם');
      }
      save(); rerender(); break; }
    case 'cleanDay': setDone(h, ui.sheet.day, true); rerender(); break;
    case 'lapseDay': ev(h, ui.sheet.day, 'lapse', { value: 1 }); save(); rerender(); break;
    case 'editEntry': ui.editEntry = v; rerender(); break;
    case 'cancelEdit': ui.editEntry = null; rerender(); break;
    case 'undoEntry': ev(h, ui.sheet.day, 'undo', { entryID: v }); save(); rerender(); break;
    case 'new': ui.editing = null; ui.draft = draftFrom(null); ui.sheet = { type: 'editor' }; rerender(); break;
    case 'edit': ui.editing = id; ui.draft = draftFrom(h); ui.sheet = { type: 'editor' }; rerender(); break;
    case 'remH': case 'remM': case 'remSet': {
      readDraft(); const d = ui.draft; let [hh, mm] = (d.reminderTime || '08:00').split(':').map(Number);
      if (a === 'remSet') [hh, mm] = v.split(':').map(Number);
      else if (a === 'remH') hh = (hh + Number(v) + 24) % 24;
      else { mm = mm + Number(v); if (mm >= 60) { mm -= 60; hh = (hh + 1) % 24; } if (mm < 0) { mm += 60; hh = (hh + 23) % 24; } mm = Math.round(mm / 5) * 5 % 60; }
      d.reminderTime = `${pad(hh)}:${pad(mm)}`; d.reminder = true; rerender(); break; }
    case 'draft': readDraft(); ui.draft[el.dataset.k] = v; if (el.dataset.k === 'icon') ui.moreIcons = false; rerender(); break;
    case 'moreIcons': readDraft(); ui.moreIcons = !ui.moreIcons; rerender(); break;
    case 'wd': { readDraft(); const n = Number(v), d = ui.draft.days; ui.draft.days = d.includes(n) ? d.filter(x => x !== n) : [...d, n]; rerender(); break; }
    case 'saveHabit': saveHabit(); break;
    case 'move': {
      const list = S.habits.slice().sort((x, y) => x.sortOrder - y.sortOrder), i = list.findIndex(x => x.id === id), j = i + Number(v);
      if (j >= 0 && j < list.length) { const t = list[i].sortOrder; list[i].sortOrder = list[j].sortOrder; list[j].sortOrder = t; save(); rerender(); }
      break; }
    case 'set': { const k = el.dataset.k; const val = isNaN(Number(v)) ? v : Number(v); if (k === 'pScale') { ui.pOff = 0; ui.barSel = null; } if (k === 'revMode') ui.revOff = 0; if (k === 'weekStart') { S.settings.weekStart = val; save(); } else ui[k] = val; rerender(); break; }
    case 'calHabit': ui.filter = id; rerender(); window.scrollTo(0, 0); document.getElementById('screen').scrollTop = 0; break;
    case 'focusOpen': ui.focus = { id, acc: 0, running: false, runStart: 0, started: false, target: 10, reached: false }; render(); break;
    case 'focusExit': { const fh = habitById(ui.focus && ui.focus.id); ui.focus = null; render(); if (fh && fh.kind === 'duration' && timerOf(fh)) toast('הסטופר ממשיך ברקע — אפשר לסיים בכרטיס הסטופר'); break; }
    case 'focusLen': ui.focus.target = Number(v); ui.focus.reached = false; render(); break;
    case 'focusToggle': { const f = ui.focus, fh = habitById(f.id);
      if (fh.kind === 'duration') { const tm = timerOf(fh); if (tm && tm.running) timerPause(fh); else timerStart(fh); }
      else if (f.running) { f.acc += Date.now() - f.runStart; f.running = false; } else { f.running = true; f.started = true; f.runStart = Date.now(); }
      render(); break; }
    case 'focusFinish': { const f = ui.focus, fh = habitById(f.id);
      if (fh.kind === 'duration') { const ms = timerFinish(fh); toast(ms >= 1000 ? `נשמרו ${fmtMin(ms / 60000)}` : 'פחות משנייה — לא נשמר'); }
      else { const ms = focusElapsed(f); setDone(fh, TODAY(), true); toast(`${fh.name}: בוצע ✓ · ${fmtMin(ms / 60000)}`); }
      ui.focus = null; render(); break; }
    case 'freeze': { const day = el.dataset.day; if (freezesIn(h, day.slice(0, 7)).length >= 1) { toast('כבר השתמשת בהקפאה של החודש'); break; }
      ev(h, day, 'rest', { note: 'freeze' }); save(); toast(`❄️ ${dayName(day)} הוקפא — הרצף נשמר`); rerender(); break; }
    case 'backupNow': backupNow(); rerender(); break;
    case 'askRestore': ui.confirm = 'restore'; rerender(); break;
    case 'restore': restoreBackup(); break;
    case 'revOff': ui.revOff = v === 'today' ? 0 : Math.min(0, (ui.revOff || 0) + Number(v)); ui.keepScroll = true; render(); break;
    case 'month': ui.calMonth = D(Number(v) < 0 ? prevMonth(S_(ui.calMonth)) : nextMonth(S_(ui.calMonth))); rerender(); break;
    case 'day': ui.sheet = { type: 'day', day: v }; rerender(); break;
    case 'settings': ui.sheet = { type: 'settings' }; ui.exportText = null; ui.confirm = null; rerender(); break;
    case 'newGoal': ui.goalDraft = { title: '', period: 'monthly', metric: 'completions', target: 20, startDay: TODAY(), endDay: S_(D(TODAY()) + 30), habitIDs: [] }; ui.sheet = { type: 'goal' }; rerender(); break;
    case 'saveGoal': {
      const g = id2 => document.getElementById(id2).value;
      const goal = { id: uid(), title: g('g-title').trim(), period: g('g-period'), metric: g('g-metric'), target: Number(g('g-target')), startDay: g('g-start'), endDay: g('g-end') || null, habitIDs: [...document.querySelectorAll('[data-gh]')].filter(x => x.checked).map(x => x.dataset.gh) };
      if (!goal.title || !goal.habitIDs.length || !(goal.target > 0)) { toast('צריך שם, יעד והרגל מקושר אחד לפחות'); break; }
      S.goals.push(goal); save(); ui.sheet = null; toast('המטרה נוספה'); rerender(); break; }
    case 'delGoal': S.goals = S.goals.filter(g => g.id !== id); save(); rerender(); break;
    case 'exportJSON': ui.exportText = JSON.stringify({ exportedAt: new Date().toISOString(), habits: S.habits, events: S.events, goals: S.goals }, null, 1); rerender(); break;
    case 'exportCSV': { const names = Object.fromEntries(S.habits.map(x => [x.id, x.name])); const qq = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
      ui.exportText = 'event_id,habit_name,entry_id,day,timestamp,action,value,duration,quality,source,previous_value,note\n' + S.events.map(x => [x.id, qq(names[x.habitID]), x.entryID, x.day, x.ts, x.action, x.value ?? '', x.duration ?? '', x.quality ?? '', x.source, x.previousValue ?? '', qq(x.note)].join(',')).join('\n'); rerender(); break; }
    case 'copyExport': { const ta = document.getElementById('export-text'); navigator.clipboard?.writeText(ta.value).then(() => toast('הועתק'), () => { ta.select(); toast('סמן והעתק ידנית'); }); if (!navigator.clipboard) { ta.select(); } break; }
    case 'askDeleteAll': ui.confirm = 'deleteAll'; rerender(); break;
    case 'numStep': { const inp = document.getElementById(el.dataset.t); if (inp) { const n = Math.max(0, Math.round(((Number(inp.value) || 0) + Number(v) * Number(el.dataset.s || 1)) * 100) / 100); inp.value = n; inp.dispatchEvent(new Event('input', { bubbles: true })); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } break; }
    case 'askResetApp': ui.confirm = 'resetApp'; rerender(); break;
    case 'resetApp': try { localStorage.clear(); sessionStorage.clear(); } catch (e) {} location.reload(); break;
    case 'calFilterOpen': ui.calPop = !ui.calPop; rerender(); break;
    case 'calFilterClose': ui.calPop = false; rerender(); break;
    case 'calFilterSet': ui.filter = v || ''; ui.calPop = false; rerender(); break;
    case 'deleteAll': S = { habits: [], events: [], goals: [], settings: S.settings, v: 1 }; save(); ui.sheet = null; ui.confirm = null; ui.detail = null; toast('כל הנתונים נמחקו'); render(); break;
    case 'askReset': S = seed(); save(); ui.sheet = null; ui.detail = null; toast('נטענו נתוני דוגמה חדשים'); render(); break;
    case 'nextQuote': ui.quoteShift = (ui.quoteShift || 0) + 1; ui.quoteAnim = true; rerender(); break;
    case 'quickTheme': S.settings.theme = isDark() ? 'light' : 'dark'; save(); applyTheme(); rerender(); break;
    case 'setTheme': S.settings.theme = v; save(); applyTheme(); rerender(); break;
    case 'theme': { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; break; }
    case 'toggleArchived': break;
    case 'toggleMarked': ui.showAllMarked = !ui.showAllMarked; rerender(); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) { ui.sheet = null; rerender(); } });
render();
setInterval(() => { timerTick(); focusTick(); }, 500);
setTimeout(autoBackup, 1500);
setInterval(() => { const now = new Date(); const c = document.getElementById('clock'); if (c) c.textContent = `${now.getHours()}:${pad(now.getMinutes())}`; }, 30000);
})();
